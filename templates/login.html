<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | MindCare AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            MindCare AI
        </div>

        <div class="nav-links">

            <a href="/">
                Home
            </a>

            <a href="/signup">
                Sign Up
            </a>

        </div>

    </nav>


    <section class="auth-section">

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to your MindCare account.
            </p>


            {% if error %}

                <div class="error-message">
                    {{ error }}
                </div>

            {% endif %}


            <form
                method="POST"
                action="/login"
            >

                <input
                    type="email"
                    name="email"
                    placeholder="Email"
                    required
                >


                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Login
                </button>

            </form>


            <p class="auth-link">

                Don't have an account?

                <a href="/signup">
                    Create Account
                </a>

            </p>

        </div>

    </section>

</body>

</html>
